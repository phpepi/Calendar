<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Routine - 24h Timeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0066cc 0%, #00cc99 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #003399;
            font-size: 1.8em;
        }

        .header .date-info {
            color: #0066cc;
            font-size: 1.1em;
            font-weight: bold;
        }

        .header .back-btn {
            background: linear-gradient(90deg, #0066cc 0%, #0099cc 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .header .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 102, 204, 0.4);
        }

        .timeline {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }

        .time-slot {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 20px;
            padding: 15px 0;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
        }

        .time-slot:last-child {
            border-bottom: none;
        }

        .time-slot:hover {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            margin: 0 -15px;
            padding-left: calc(15px + 80px);
        }

        .time-label {
            font-weight: bold;
            color: #003399;
            font-size: 1.1em;
            text-align: center;
            padding-top: 5px;
        }

        .time-label.event-time {
            background: linear-gradient(135deg, #0066cc 0%, #00cc99 100%);
            color: white;
            padding: 8px;
            border-radius: 8px;
            position: relative;
            z-index: 2;
        }

        .activities {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 40px;
            position: relative;
        }

        .activity {
            background: linear-gradient(90deg, #e0f7f0 0%, #d4ede8 100%);
            border-left: 4px solid #0099cc;
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .activity:hover {
            background: linear-gradient(90deg, #c0ebe0 0%, #b0dfd0 100%);
            border-left-color: #0066cc;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2);
        }

        .activity-text {
            flex-grow: 1;
            color: #003399;
            font-weight: 500;
        }

        .activity-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s ease;
        }

        .activity-delete:hover {
            background: #ff5252;
        }

        .activity.event-activity {
            background: linear-gradient(135deg, #0066cc 0%, #00cc99 100%);
            border-left-color: #003399;
            color: white;
        }

        .activity.event-activity .activity-text {
            color: white;
            font-weight: bold;
            font-size: 1.1em;
        }

        .activity.event-activity .activity-delete {
            display: none;
        }

        .add-activity {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
        }

        .add-activity input {
            flex-grow: 1;
            padding: 10px;
            border: 2px solid #0099cc;
            border-radius: 6px;
            font-size: 0.95em;
            transition: border-color 0.2s ease;
        }

        .add-activity input:focus {
            outline: none;
            border-color: #0066cc;
        }

        .add-activity button {
            background: linear-gradient(90deg, #0066cc 0%, #0099cc 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .add-activity button:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        .summary {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .summary h3 {
            color: #003399;
            margin-bottom: 15px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
            color: #0066cc;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-value {
            font-weight: bold;
            color: #003399;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .header .back-btn {
                width: 100%;
            }

            .time-slot {
                grid-template-columns: 60px 1fr;
                gap: 10px;
                padding: 10px 0;
            }

            .time-label {
                font-size: 0.9em;
            }

            .activity {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .activity-delete {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Daily Routine</h1>
            <div class="date-info" id="dateDisplay"></div>
            <button class="back-btn" onclick="history.back()">← Back to Calendar</button>
        </div>

        <div class="timeline" id="timeline">
            <!-- Timeline will be generated by JavaScript -->
        </div>

        <div class="summary">
            <h3>📊 Daily Summary</h3>
            <div class="summary-item">
                <span>Total Activities:</span>
                <span class="summary-value" id="activityCount">0</span>
            </div>
            <div class="summary-item">
                <span>Time Slots Used:</span>
                <span class="summary-value" id="slotsUsed">0</span>
            </div>
        </div>
    </div>

    <script>
        // Get date from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const selectedDate = urlParams.get('date') || new Date().toISOString().split('T')[0];
        
        // Parse date
        const [year, month, day] = selectedDate.split('-');
        const dateObj = new Date(year, parseInt(month) - 1, day);
        const dateStr = dateObj.toLocaleDateString('en-US', { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
        });

        // Check if there's an event on this date
        const events = {
            '2026-06-15': 'ZP',
            '2026-06-29': 'PIA',
            '2026-07-01': 'TELEKOM',
            '2026-07-04': 'ZP',
            '2026-07-22': 'KDP',
            '2026-07-29': 'BAZE',
            '2026-07-31': 'FIZIKA'
        };

        const eventOnThisDay = events[selectedDate];

        // Display date
        document.getElementById('dateDisplay').textContent = dateStr;

        // Storage key
        const storageKey = 'routine_' + selectedDate;

        // Load activities from localStorage
        function loadActivities() {
            const stored = localStorage.getItem(storageKey);
            return stored ? JSON.parse(stored) : {};
        }

        // Save activities to localStorage
        function saveActivities(activities) {
            localStorage.setItem(storageKey, JSON.stringify(activities));
            updateSummary();
        }

        // Create timeline
        function createTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';
            const activities = loadActivities();

            for (let hour = 0; hour < 24; hour++) {
                const timeSlot = document.createElement('div');
                timeSlot.className = 'time-slot';

                // Time label
                const timeLabel = document.createElement('div');
                const timeStr = hour.toString().padStart(2, '0') + ':00';
                
                // Check if event is at this hour (13:00)
                if (eventOnThisDay && hour === 13) {
                    timeLabel.className = 'time-label event-time';
                    timeLabel.textContent = timeStr;
                } else {
                    timeLabel.className = 'time-label';
                    timeLabel.textContent = timeStr;
                }

                // Activities container
                const activitiesDiv = document.createElement('div');
                activitiesDiv.className = 'activities';

                // Add event if it exists at 13:00
                if (eventOnThisDay && hour === 13) {
                    const eventActivity = document.createElement('div');
                    eventActivity.className = 'activity event-activity';
                    eventActivity.innerHTML = `<span class="activity-text">📌 ${eventOnThisDay}</span>`;
                    activitiesDiv.appendChild(eventActivity);
                }

                // Add stored activities for this hour
                if (activities[hour]) {
                    activities[hour].forEach((activity, index) => {
                        const actDiv = document.createElement('div');
                        actDiv.className = 'activity';
                        actDiv.innerHTML = `
                            <span class="activity-text">${activity}</span>
                            <button class="activity-delete" onclick="deleteActivity(${hour}, ${index})">✕</button>
                        `;
                        activitiesDiv.appendChild(actDiv);
                    });
                }

                // Add input form for adding new activity
                if (!eventOnThisDay || hour !== 13) {
                    const addForm = document.createElement('div');
                    addForm.className = 'add-activity';
                    addForm.innerHTML = `
                        <input type="text" placeholder="Add activity..." id="input-${hour}">
                        <button onclick="addActivity(${hour})">+</button>
                    `;
                    activitiesDiv.appendChild(addForm);

                    // Allow Enter key
                    activitiesDiv.querySelector(`#input-${hour}`).addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            addActivity(hour);
                        }
                    });
                }

                timeSlot.appendChild(timeLabel);
                timeSlot.appendChild(activitiesDiv);
                timeline.appendChild(timeSlot);
            }
        }

        // Add activity
        function addActivity(hour) {
            const input = document.getElementById(`input-${hour}`);
            const activity = input.value.trim();

            if (activity) {
                const activities = loadActivities();
                if (!activities[hour]) {
                    activities[hour] = [];
                }
                activities[hour].push(activity);
                saveActivities(activities);
                createTimeline();
            }
        }

        // Delete activity
        function deleteActivity(hour, index) {
            const activities = loadActivities();
            if (activities[hour]) {
                activities[hour].splice(index, 1);
                if (activities[hour].length === 0) {
                    delete activities[hour];
                }
                saveActivities(activities);
                createTimeline();
            }
        }

        // Update summary
        function updateSummary() {
            const activities = loadActivities();
            let totalActivities = 0;
            let slotsUsed = 0;

            for (let hour in activities) {
                totalActivities += activities[hour].length;
                slotsUsed++;
            }

            document.getElementById('activityCount').textContent = totalActivities;
            document.getElementById('slotsUsed').textContent = slotsUsed;
        }

        // Initialize
        createTimeline();
        updateSummary();
    </script>
</body>
</html>
